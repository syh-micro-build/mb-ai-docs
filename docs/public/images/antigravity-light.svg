<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="title"><title id="title">Micro Build AI 接入示意图</title><rect width="720" height="360" rx="14" fill="#f5faf9"/><g font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif"><text x="28" y="43" fill="#183c3a" font-size="26" font-weight="700" text-anchor="start">Antigravity CLI：先启用 Gemini 模式</text><text x="28" y="75" fill="#506c6a" font-size="18" font-weight="400" text-anchor="start">配置示意 · agy 与桌面 IDE 的接入方式不同</text><rect x="28" y="104" width="208" height="190" rx="16" fill="#ffffff" stroke="#cfe3df"/><circle cx="58" cy="136" r="20" fill="#e0f4ed"/><text x="58" y="143" fill="#0f766e" font-size="22" font-weight="700" text-anchor="middle">1</text><text x="46" y="184" fill="#183c3a" font-size="23" font-weight="700" text-anchor="start">用户配置文件</text><text x="46" y="220" fill="#506c6a" font-size="19" font-weight="400" text-anchor="start">antigravity-cli/</text><text x="46" y="248" fill="#506c6a" font-size="19" font-weight="400" text-anchor="start">启用 gemini 模式</text><path d="M242 203H248m-6 -6 6 6-6 6" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="262" y="104" width="208" height="190" rx="16" fill="#ffffff" stroke="#cfe3df"/><circle cx="292" cy="136" r="20" fill="#e0f4ed"/><text x="292" y="143" fill="#0f766e" font-size="22" font-weight="700" text-anchor="middle">2</text><text x="280" y="184" fill="#183c3a" font-size="23" font-weight="700" text-anchor="start">当前启动终端</text><text x="280" y="220" fill="#506c6a" font-size="19" font-weight="400" text-anchor="start">确认平台接入根地址</text><text x="280" y="248" fill="#506c6a" font-size="19" font-weight="400" text-anchor="start">提供自己的平台密钥</text><path d="M476 203H482m-6 -6 6 6-6 6" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="496" y="104" width="208" height="190" rx="16" fill="#ffffff" stroke="#cfe3df"/><circle cx="526" cy="136" r="20" fill="#e0f4ed"/><text x="526" y="143" fill="#0f766e" font-size="22" font-weight="700" text-anchor="middle">3</text><text x="514" y="184" fill="#183c3a" font-size="23" font-weight="700" text-anchor="start">启动 agy 并验证</text><text x="514" y="220" fill="#506c6a" font-size="19" font-weight="400" text-anchor="start">选择可用模型</text><text x="514" y="248" fill="#506c6a" font-size="19" font-weight="400" text-anchor="start">检查回复与使用记录</text><text x="28" y="334" fill="#506c6a" font-size="18" font-weight="400" text-anchor="start">只有管理员指定专用通道时，才使用 /antigravity 前缀。</text></g></svg>
