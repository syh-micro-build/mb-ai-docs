<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="title"><title id="title">Micro Build AI 接入示意图</title><rect width="720" height="360" rx="14" fill="#f5faf9"/><g font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif"><text x="28" y="43" fill="#183c3a" font-size="26" font-weight="700" text-anchor="start">接入时，逐项核对</text><text x="28" y="75" fill="#506c6a" font-size="18" font-weight="400" text-anchor="start">配置示意 · 不同工具的地址规则请看对应教程</text><rect x="28" y="100" width="664" height="55" rx="16" fill="#ffffff" stroke="#cfe3df"/><circle cx="57" cy="127" r="20" fill="#e0f4ed"/><text x="57" y="134" fill="#0f766e" font-size="22" font-weight="700" text-anchor="middle">1</text><text x="92" y="135" fill="#183c3a" font-size="22" font-weight="600" text-anchor="start">API 地址</text><text x="244" y="135" fill="#506c6a" font-size="20" font-weight="400" text-anchor="start">https://ai.mbuild.top 或 /v1</text><rect x="28" y="165" width="664" height="55" rx="16" fill="#ffffff" stroke="#cfe3df"/><circle cx="57" cy="192" r="20" fill="#e0f4ed"/><text x="57" y="199" fill="#0f766e" font-size="22" font-weight="700" text-anchor="middle">2</text><text x="92" y="200" fill="#183c3a" font-size="22" font-weight="600" text-anchor="start">API Key</text><text x="244" y="200" fill="#506c6a" font-size="20" font-weight="400" text-anchor="start">自己的完整密钥，截图仅显示掩码</text><rect x="28" y="230" width="664" height="55" rx="16" fill="#ffffff" stroke="#cfe3df"/><circle cx="57" cy="257" r="20" fill="#e0f4ed"/><text x="57" y="264" fill="#0f766e" font-size="22" font-weight="700" text-anchor="middle">3</text><text x="92" y="265" fill="#183c3a" font-size="22" font-weight="600" text-anchor="start">模型 ID</text><text x="244" y="265" fill="#506c6a" font-size="20" font-weight="400" text-anchor="start">从平台复制，并确认工具支持的协议</text><text x="28" y="334" fill="#506c6a" font-size="18" font-weight="400" text-anchor="start">填完后选中服务商与模型，再发送一条简短测试消息。</text></g></svg>
