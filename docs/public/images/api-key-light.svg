<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="title"><title id="title">Micro Build AI 接入示意图</title><rect width="720" height="360" rx="14" fill="#f5faf9"/><g font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif"><text x="28" y="43" fill="#183c3a" font-size="26" font-weight="700" text-anchor="start">为工具创建独立密钥</text><text x="28" y="75" fill="#506c6a" font-size="18" font-weight="400" text-anchor="start">配置示意 · 字段与按钮以平台实际页面为准</text><rect x="28" y="100" width="324" height="202" rx="16" fill="#ffffff" stroke="#cfe3df"/><rect x="370" y="100" width="322" height="202" rx="16" fill="#ffffff" stroke="#cfe3df"/><circle cx="62" cy="134" r="20" fill="#e0f4ed"/><text x="62" y="141" fill="#0f766e" font-size="22" font-weight="700" text-anchor="middle">1</text><text x="94" y="142" fill="#183c3a" font-size="23" font-weight="700" text-anchor="start">填写用途与权限</text><text x="48" y="187" fill="#183c3a" font-size="21" font-weight="400" text-anchor="start">名称   my-claude-code</text><text x="48" y="226" fill="#183c3a" font-size="20" font-weight="400" text-anchor="start">分组   管理员分配的范围</text><text x="48" y="269" fill="#506c6a" font-size="19" font-weight="400" text-anchor="start">有效期 / 额度按需设置</text><circle cx="404" cy="134" r="20" fill="#e0f4ed"/><text x="404" y="141" fill="#0f766e" font-size="22" font-weight="700" text-anchor="middle">2</text><text x="436" y="142" fill="#183c3a" font-size="23" font-weight="700" text-anchor="start">复制完整值并保管</text><rect x="390" y="166" width="282" height="50" rx="8" fill="#e0f4ed" stroke="#cfe3df"/><text x="410" y="199" fill="#0f766e" font-size="25" font-weight="600" text-anchor="start">sk-••••••••••••</text><text x="390" y="253" fill="#183c3a" font-size="20" font-weight="400" text-anchor="start">完整值放入自己的工具</text><text x="390" y="281" fill="#506c6a" font-size="19" font-weight="400" text-anchor="start">分享截图时只显示掩码</text><text x="28" y="334" fill="#506c6a" font-size="18" font-weight="400" text-anchor="start">图中的掩码不能用于调用，也不代表平台密钥的固定格式。</text></g></svg>
