<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="title"><title id="title">Micro Build AI 接入示意图</title><rect width="720" height="360" rx="14" fill="#172524"/><g font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif"><text x="28" y="43" fill="#edf8f5" font-size="26" font-weight="700" text-anchor="start">Claude Code：先确认 Messages 接口</text><text x="28" y="75" fill="#b0cdc5" font-size="18" font-weight="400" text-anchor="start">接入示意 · 需要 Claude 模型及对应权限</text><rect x="28" y="104" width="208" height="190" rx="16" fill="#203431" stroke="#3b5750"/><circle cx="58" cy="136" r="20" fill="#294940"/><text x="58" y="143" fill="#5eead4" font-size="22" font-weight="700" text-anchor="middle">1</text><text x="46" y="184" fill="#edf8f5" font-size="23" font-weight="700" text-anchor="start">Claude Code</text><text x="46" y="220" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">设置平台根地址</text><text x="46" y="248" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">使用个人平台密钥</text><path d="M242 203H248m-6 -6 6 6-6 6" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="262" y="104" width="208" height="190" rx="16" fill="#203431" stroke="#3b5750"/><circle cx="292" cy="136" r="20" fill="#294940"/><text x="292" y="143" fill="#5eead4" font-size="22" font-weight="700" text-anchor="middle">2</text><text x="280" y="184" fill="#edf8f5" font-size="23" font-weight="700" text-anchor="start">Micro Build AI</text><text x="280" y="220" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">请求 /v1/messages</text><text x="280" y="248" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">按密钥与模型路由</text><path d="M476 203H482m-6 -6 6 6-6 6" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="496" y="104" width="208" height="190" rx="16" fill="#203431" stroke="#3b5750"/><circle cx="526" cy="136" r="20" fill="#294940"/><text x="526" y="143" fill="#5eead4" font-size="22" font-weight="700" text-anchor="middle">3</text><text x="514" y="184" fill="#edf8f5" font-size="23" font-weight="700" text-anchor="start">验证本次使用</text><text x="514" y="220" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">先发送简单请求</text><text x="514" y="248" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">再检查平台使用记录</text><text x="28" y="334" fill="#b0cdc5" font-size="18" font-weight="400" text-anchor="start">根地址填 https://ai.mbuild.top；不要重复追加 /v1。</text></g></svg>
