<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="title"><title id="title">Micro Build AI 接入示意图</title><rect width="720" height="360" rx="14" fill="#172524"/><g font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif"><text x="28" y="43" fill="#edf8f5" font-size="26" font-weight="700" text-anchor="start">从第一次调用开始</text><text x="28" y="75" fill="#b0cdc5" font-size="18" font-weight="400" text-anchor="start">Micro Build AI · 新手接入路线</text><rect x="28" y="104" width="208" height="190" rx="16" fill="#203431" stroke="#3b5750"/><circle cx="58" cy="136" r="20" fill="#294940"/><text x="58" y="143" fill="#5eead4" font-size="22" font-weight="700" text-anchor="middle">1</text><text x="46" y="184" fill="#edf8f5" font-size="23" font-weight="700" text-anchor="start">登录平台</text><text x="46" y="220" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">确认账号与余额</text><text x="46" y="248" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">准备一个小请求</text><path d="M242 203H248m-6 -6 6 6-6 6" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="262" y="104" width="208" height="190" rx="16" fill="#203431" stroke="#3b5750"/><circle cx="292" cy="136" r="20" fill="#294940"/><text x="292" y="143" fill="#5eead4" font-size="22" font-weight="700" text-anchor="middle">2</text><text x="280" y="184" fill="#edf8f5" font-size="23" font-weight="700" text-anchor="start">准备三项信息</text><text x="280" y="220" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">地址 · 密钥 · 模型</text><text x="280" y="248" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">模型权限以平台为准</text><path d="M476 203H482m-6 -6 6 6-6 6" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="496" y="104" width="208" height="190" rx="16" fill="#203431" stroke="#3b5750"/><circle cx="526" cy="136" r="20" fill="#294940"/><text x="526" y="143" fill="#5eead4" font-size="22" font-weight="700" text-anchor="middle">3</text><text x="514" y="184" fill="#edf8f5" font-size="23" font-weight="700" text-anchor="start">连接你的工具</text><text x="514" y="220" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">先收到有效回复</text><text x="514" y="248" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">再核对记录与费用</text><text x="28" y="334" fill="#b0cdc5" font-size="18" font-weight="400" text-anchor="start">每完成一步，再继续下一步；无需一次读完所有工具教程。</text></g></svg>
