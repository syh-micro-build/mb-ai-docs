<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="title"><title id="title">Micro Build AI 接入示意图</title><rect width="720" height="360" rx="14" fill="#172524"/><g font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif"><text x="28" y="43" fill="#edf8f5" font-size="26" font-weight="700" text-anchor="start">这三项都对应上，就完成首次接入</text><text x="28" y="75" fill="#b0cdc5" font-size="18" font-weight="400" text-anchor="start">核对示意 · 以自己的实际请求为准</text><rect x="28" y="104" width="208" height="190" rx="16" fill="#203431" stroke="#3b5750"/><circle cx="58" cy="136" r="20" fill="#294940"/><text x="58" y="143" fill="#5eead4" font-size="22" font-weight="700" text-anchor="middle">1</text><text x="46" y="184" fill="#edf8f5" font-size="23" font-weight="700" text-anchor="start">收到有效回复</text><text x="46" y="220" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">工具中选中的</text><text x="46" y="248" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">是目标服务商与模型</text><path d="M242 203H248m-6 -6 6 6-6 6" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="262" y="104" width="208" height="190" rx="16" fill="#203431" stroke="#3b5750"/><circle cx="292" cy="136" r="20" fill="#294940"/><text x="292" y="143" fill="#5eead4" font-size="22" font-weight="700" text-anchor="middle">2</text><text x="280" y="184" fill="#edf8f5" font-size="23" font-weight="700" text-anchor="start">看到使用记录</text><text x="280" y="220" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">时间 · 模型 · 密钥</text><text x="280" y="248" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">与本次请求相对应</text><path d="M476 203H482m-6 -6 6 6-6 6" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="496" y="104" width="208" height="190" rx="16" fill="#203431" stroke="#3b5750"/><circle cx="526" cy="136" r="20" fill="#294940"/><text x="526" y="143" fill="#5eead4" font-size="22" font-weight="700" text-anchor="middle">3</text><text x="514" y="184" fill="#edf8f5" font-size="23" font-weight="700" text-anchor="start">核对用量费用</text><text x="514" y="220" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">记录中的费用</text><text x="514" y="248" fill="#b0cdc5" font-size="19" font-weight="400" text-anchor="start">与平台余额变化一致</text><text x="28" y="334" fill="#b0cdc5" font-size="18" font-weight="400" text-anchor="start">有回复却没记录？先检查是否选中了工具内置服务。</text></g></svg>
