name: Documentation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate and build documentation
        run: npm run check

      - name: Upload static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: micro-build-ai-docs
          path: docs/.vitepress/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --tag mb-ai-docs:ci .

      - name: Start Docker container
        run: |
          docker run \
            --detach \
            --name mb-ai-docs-smoke \
            --publish 127.0.0.1:8081:80 \
            mb-ai-docs:ci

      - name: Wait for documentation service
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8081/docs/ > /dev/null; then
              exit 0
            fi

            sleep 1
          done

          docker logs mb-ai-docs-smoke
          exit 1

      - name: Verify documentation routes
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/docs/)" = "200"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/docs/tools/codex)" = "200"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/docs/test-not-exists-123456)" = "404"

      - name: Show container logs on failure
        if: failure()
        run: docker logs mb-ai-docs-smoke

      - name: Stop Docker container
        if: always()
        run: docker rm --force mb-ai-docs-smoke || true
