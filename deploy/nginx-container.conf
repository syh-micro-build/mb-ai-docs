server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = / {
        return 302 /docs/;
    }

    location = /docs {
        return 308 /docs/;
    }

    location ^~ /docs/ {
        try_files $uri $uri.html $uri/ =404;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}