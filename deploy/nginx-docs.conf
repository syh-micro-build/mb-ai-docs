# Add these locations to the existing ai.mbuild.top HTTPS server block.
# Layout: /opt/mbuild-ai-docs/current/docs/{index.html, assets/, tools/, ...}
# Copy docs/.vitepress/dist/ contents into the docs/ subdirectory above.
# Keep the existing Sub2API proxy locations in that server block.

location = /docs {
    return 308 /docs/;
}

location ^~ /docs/ {
    root /opt/mbuild-ai-docs/current;
    index index.html;
    try_files $uri $uri.html $uri/ =404;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
